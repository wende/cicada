coverage:
  precision: 2
  round: down
  range: "80...100"

  # Use the same calculation as pytest-cov
  # This matches: (lines_covered + branches_covered) / (lines_valid + branches_valid)
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        # Include both line and branch coverage in calculation
        branches: true

ignore:
  - "tests/**"
  - "**/__pycache__/**"
  - "**/venv/**"
  - "**/site-packages/**"
  - "**/*.pyc"
  - "tests/fixtures/**"

comment:
  layout: "diff, files"
  behavior: default
  require_changes: false
